:root {
  color-scheme: light;
  --page: #faf4ed;
  --paper: #fffdfa;
  --ink: #3c2527;
  --muted: #785d5d;
  --accent: #8e3a4c;
  --accent-dark: #732d3d;
  --rose: #f2dfe0;
  --line: #e9d9d3;
  --serif: "Survey Serif", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif;
  --sans: "DM Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  min-width: 280px;
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
}
button, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

.shell { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }
.site-header { border-bottom: 1px solid var(--line); }
.header-inner { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; text-decoration: none; }
.brand-icon { display: inline-grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; color: var(--accent); background: var(--rose); font-size: 15px; }
.source-link { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
.source-link:hover { color: var(--accent-dark); text-decoration: underline; }
.source-link span { display: inline-block; margin-left: 3px; }

.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1.02fr;
  min-height: 400px;
  margin-top: 34px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 23px;
  background: #f8e8df;
}
.hero-copy { padding: 42px 38px 42px clamp(33px, 5.6vw, 80px); align-self: center; }
.hero-rule { width: 74px; display: flex; gap: 8px; align-items: center; color: var(--accent); font-size: 12px; }
.hero-rule i { flex: 1; height: 1px; background: #bd8790; }
h1, h2 { margin: 0; font-family: var(--serif); font-weight: 700; }
h1 { margin-top: 12px; font-size: clamp(39px, 5.2vw, 66px); line-height: 1.19; letter-spacing: .008em; }
.hero-copy p { margin: 19px 0 24px; font-size: 15px; color: var(--muted); }
.hero-image { display: block; width: 100%; height: 100%; min-height: 0; object-fit: cover; }
.button, .plain-button, .icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  color: var(--accent);
  background: transparent;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}
.button { min-height: 46px; padding: 9px 20px; border: 1px solid transparent; border-radius: 9px; white-space: nowrap; }
.button span, .plain-button span { font-size: 1.15em; line-height: 1; }
.primary { color: white; background: var(--accent); }
.primary:hover { background: var(--accent-dark); }
.secondary { border-color: var(--line); background: var(--paper); }
.secondary:hover:not(:disabled) { background: #fbf0ee; border-color: #d8aeb0; }
.secondary:disabled { color: #8c7978; opacity: .62; }
.plain-button { min-height: 32px; padding: 2px 0; }
.plain-button:hover { color: var(--accent-dark); text-decoration: underline; }
.hero-action { padding-inline: 21px; border-radius: 8px; }

.survey { max-width: 740px; margin: 39px auto 34px; scroll-margin-top: 24px; }
.progress-block { margin-bottom: 17px; }
.progress-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.progress-label { font-size: 14px; font-weight: 700; }
.progress-label strong { margin-left: 8px; color: var(--accent); font-variant-numeric: tabular-nums; }
.grid-icon { width: 10px; height: 10px; background: radial-gradient(circle, currentColor 1.15px, transparent 1.4px) 0 0/5px 5px; }
progress { display: block; width: 100%; height: 6px; appearance: none; border: 0; border-radius: 20px; overflow: hidden; color: var(--accent); background: #eeddd9; }
progress::-webkit-progress-bar { background: #eeddd9; }
progress::-webkit-progress-value { background: var(--accent); border-radius: 20px; transition: width .24s ease; }
progress::-moz-progress-bar { background: var(--accent); border-radius: 20px; }

.panel { padding: 30px 35px; border: 1px solid var(--line); border-radius: 19px; background: var(--paper); box-shadow: 0 10px 26px #6f3c3510; }
.question-meta { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .04em; }
.required { padding: 0 7px; border-radius: 4px; background: #f6e6e6; font-size: 11px; }
.question-title { margin: 10px 0 15px; font-size: clamp(21px, 3vw, 29px); line-height: 1.47; overflow-wrap: anywhere; }
.question-title label { cursor: text; }
textarea {
  display: block;
  width: 100%;
  min-height: 126px;
  padding: 13px 15px;
  resize: vertical;
  color: var(--ink);
  border: 1px solid #e2cecb;
  border-radius: 10px;
  background: #fcf8f4;
}
textarea::placeholder { color: #846f70; }
textarea:focus { outline: 2px solid #a15c6c; outline-offset: 1px; }
textarea[aria-invalid="true"] { border-color: var(--accent); }
.question-navigation { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
.error { margin: 8px 0 0; color: var(--accent-dark); font-size: 14px; }
.draft-note { margin: 15px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
.panel-intro { margin: 7px 0 20px; color: var(--muted); font-size: 14px; }
.review-panel h2, .done-panel h2 { font-size: 29px; }
.review-list { padding: 0; margin: 0; list-style: none; }
.review-list li { border-top: 1px solid var(--line); padding: 13px 0; }
.review-list li:last-child { border-bottom: 1px solid var(--line); }
.review-question { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.review-question h3 { margin: 3px 0; font-size: 14px; }
.review-question button { min-height: 30px; white-space: nowrap; }
.review-list p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font-size: 14px; }
.done-panel { padding-block: 38px; text-align: center; }
.done-icon { display: inline-grid; margin-bottom: 10px; width: 52px; height: 52px; place-items: center; border-radius: 50%; background: var(--rose); color: var(--accent); font-size: 22px; }
.done-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
.export-status { margin: 11px 0 2px; color: var(--muted); font-size: 13px; }
.export-status:empty { display: none; }
.copy-fallback { margin-block: 12px; min-height: 190px; }
.done-panel > .plain-button { margin-top: 14px; }

dialog { width: min(440px, calc(100% - 30px)); max-height: calc(100% - 30px); padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); color: var(--ink); box-shadow: 0 18px 50px #3c25272c; }
dialog::backdrop { background: #34252970; }
.dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dialog-heading h2 { font-size: 23px; }
.icon-button { width: 40px; height: 40px; border-radius: 50%; background: #f7e8e7; font-size: 24px; font-weight: 400; }

.dialog-description { margin: 6px 0 17px; color: var(--muted); font-size: 13px; }
.index-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }

  .shell { width: calc(100% - 32px); }
  .header-inner { min-height: 56px; }
  .hero { min-height: 0; margin-top: 19px; grid-template-columns: 1fr; border-radius: 18px; }

  .panel { padding: 21px 17px; border-radius: 15px; }

  .index-grid { gap: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

      <section class="panel done-panel" id="done" aria-labelledby="done-title" hidden>
        <div class="done-icon" aria-hidden="true">♥</div>
        <h2 id="done-title" tabindex="-1">答卷已生成</h2>
        <p class="panel-intro">复制或下载答卷，再发给对方。</p>
        <div class="done-actions">
          <button class="button primary" id="copy" type="button">复制答卷</button>
          <button class="button secondary" id="download" type="button">下载答卷 <span aria-hidden="true">↓</span></button>
        </div>
        <p class="export-status" id="export-status" role="status"></p>
        <textarea class="copy-fallback" id="copy-fallback" aria-label="完整答卷" readonly hidden></textarea>
        <button class="plain-button" id="back-to-review" type="button"><span aria-hidden="true">←</span> 查看与修改</button>
      </section>

      <p class="draft-note" id="draft-note">草稿自动保存在当前浏览器，答卷由你自行发送。</p>
      <noscript><p class="error">请启用 JavaScript 后填写问卷。</p></noscript>
    </section>
  </main>

  <dialog id="question-index" aria-labelledby="index-title">
    <div class="dialog-heading">
      <h2 id="index-title">题目目录</h2>
      <form method="dialog">
        <button class="icon-button" type="submit" aria-label="关闭题目目录">×</button>
      </form>
    </div>
    <p class="dialog-description">点选题号跳转，粉色题号表示已回答。</p>
    <div class="index-grid" id="index-grid"></div>
  </dialog>
  <script>
"use strict";

const questions = [
  "你认为女朋友是一个什么样的人？",
  "觉得女朋友哪里好？",
  "如果女朋友不漂亮了还会喜欢吗？",
  "你最想让女朋友改正的缺点是什么？",
  "你认为值得纪念的日子是什么？",
  "你最看重伴侣什么品质？",
  "当你情绪不好的时候希望女朋友怎么安慰你？",
  "如果发现有人在背后说女朋友坏话会怎么办？",
  "你的恋爱消费观是什么？",
  "女朋友送你什么会很开心？",
  "你觉得幸福是什么样的？",
  "恋爱中你认为重要的是什么？",
  "你对女朋友的第一印象是什么？",
  "如果女朋友主动找你索要东西会觉得她拜金吗？",
  "你会觉得女朋友无理取闹吗？",
  "情侣之间你喜欢什么相处方式？",
  "喜欢女朋友怎么称呼你？",
  "讨厌女朋友粘人吗？",
  "说说你最想和女朋友做的三件事。",
  "最想和女朋友去哪里？",
  "你会注重每个节日或是纪念日吗？",
  "你对两个人未来的规划是什么？",
  "如果未来你们吵架吵得很凶你会怎么做？",
  "女朋友说什么话让你最生气？",
  "如果感情出现分歧需要妥协，你愿意吗？",
  "如果两个人没有话题了怎么办？",
  "平时不好意思对女朋友说的想法是什么？",
  "和女朋友呆在一起你会不会觉得她很麻烦？",
  "你反感的吵架方式是什么？",
  "你是为什么喜欢你女朋友又是什么时候开始喜欢你女朋友的？",
  "如果可以许一个愿望你会许什么？",
  "你对爱的理解？",
  "你对女朋友了解有多少？",
  "请你说出现在对女朋友的看法。"
];

const draftKey = "our-love-questionnaire:draft:v1";
const el = (id) => document.getElementById(id);
const form = el("question-form");
const answer = el("answer");
const error = el("error");
const review = el("review");
const done = el("done");
const indexDialog = el("question-index");
const next = el("next");
const previous = el("previous");
const progress = el("progress");
const draftNote = el("draft-note");
const baseNote = draftNote.textContent;
const exportStatus = el("export-status");
const fallback = el("copy-fallback");

let draftAvailable = true;
const state = loadDraft();
let screen = "question";
let returningToReview = false;

function loadDraft() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(draftKey) || "null");
  } catch {
    draftAvailable = false;
  }
  const savedAnswers = Array.isArray(saved?.answers) ? saved.answers : [];
  const answers = questions.map((_, index) => typeof savedAnswers[index] === "string" ? savedAnswers[index] : "");
  const index = Number.isInteger(saved?.index) && saved.index >= 0 && saved.index < questions.length
    ? saved.index : 0;
  return { answers, index, complete: saved?.complete === true && answers.every((value) => value.trim()) };
}

function saveDraft() {
  try {
    localStorage.setItem(draftKey, JSON.stringify(state));
    draftAvailable = true;
  } catch {
    draftAvailable = false;
  }
  updateDraftNote();
}

function updateDraftNote() {
  draftNote.textContent = draftAvailable
    ? baseNote
    : "当前浏览器无法保存草稿，请在此页填完并导出答卷。";
}

function isAnswered(index) {
  return state.answers[index].trim().length > 0;
}

function updateProgress() {
  const count = questions.reduce((total, _, index) => total + Number(isAnswered(index)), 0);
  progress.value = count;
  el("progress-value").textContent = count + " / " + questions.length;
  el("start").firstChild.nodeValue = screen === "done" ? "查看答卷 " : count > 0 ? "继续填写 " : "开始填写 ";
}

function moveFocus(target) {
  target.focus({ preventScroll: true });
  el("survey").scrollIntoView({ block: "start" });
}

function changeScreen(name, focusTarget) {
  screen = name;
  form.hidden = name !== "question";
  review.hidden = name !== "review";
  done.hidden = name !== "done";
  updateProgress();
  if (focusTarget) moveFocus(focusTarget);
}

function showError(message) {
  error.textContent = message;
  error.hidden = !message;
  if (message) {
    answer.setAttribute("aria-invalid", "true");
    answer.setAttribute("aria-describedby", "error");
  } else {
    answer.removeAttribute("aria-invalid");
    answer.removeAttribute("aria-describedby");
  }
}

function showQuestion(index, { focus = true, fromReview = false } = {}) {
  state.index = index;
  returningToReview = fromReview;
  const atEnd = index === questions.length - 1;
  el("question-number").textContent = "第 " + String(index + 1).padStart(2, "0") + " 题";
  el("question-label").textContent = questions[index];
  answer.value = state.answers[index];
  previous.disabled = index === 0;
  next.firstChild.nodeValue = fromReview ? "返回检查 " : atEnd ? "检查答卷 " : "下一题 ";
  showError("");
  changeScreen("question", focus ? el("question-title") : null);
  saveDraft();
}

function showReview() {
  const list = el("review-list");
  const entries = questions.map((question, index) => {
    const item = document.createElement("li");
    const row = document.createElement("div");
    row.className = "review-question";
    const title = document.createElement("h3");
    title.textContent = (index + 1) + ". " + question;
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "plain-button";
    edit.textContent = "修改";
    edit.setAttribute("aria-label", "修改第 " + (index + 1) + " 题");
    edit.addEventListener("click", () => showQuestion(index, { fromReview: true }));
    const value = document.createElement("p");
    value.textContent = state.answers[index].trim();
    row.append(title, edit);
    item.append(row, value);
    return item;
  });
  list.replaceChildren(...entries);
  changeScreen("review", el("review-title"));
}

function checkReview() {
  const firstMissing = questions.findIndex((_, index) => !isAnswered(index));
  if (firstMissing !== -1) {
    showQuestion(firstMissing);
    showError("还有题目没有回答，已帮你跳到第一道未答题。");
    return;
  }
  showReview();
}

function showDone(focus = true) {
  exportStatus.textContent = "";
  fallback.hidden = true;
  changeScreen("done", focus ? el("done-title") : null);
}

function responseText() {
  const entries = questions.map((question, index) =>
    (index + 1) + ". " + question + "\n" + state.answers[index].trim()
  );
  return "男朋友恋爱问卷调查 · 我的答卷\n\n" + entries.join("\n\n") + "\n";
}

answer.addEventListener("input", () => {
  state.answers[state.index] = answer.value;
  state.complete = false;
  if (error.textContent && isAnswered(state.index)) showError("");
  updateProgress();
  saveDraft();
});

form.addEventListener("submit", (event) => {
  event.preventDefault();
  if (!isAnswered(state.index)) {
    showError("请先回答这道题。");
    answer.focus();
    return;
  }
  if (returningToReview || state.index === questions.length - 1) {
    checkReview();
  } else {
    showQuestion(state.index + 1);
  }
});

previous.addEventListener("click", () => {
  if (state.index > 0) showQuestion(state.index - 1, { fromReview: returningToReview });
});
el("back-to-question").addEventListener("click", () => showQuestion(state.index));
el("back-to-review").addEventListener("click", checkReview);
el("start").addEventListener("click", () => {
  const targets = { question: "question-title", review: "review-title", done: "done-title" };
  moveFocus(el(targets[screen]));
});

el("open-index").addEventListener("click", () => {
  const options = questions.map((question, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "index-item";
    button.textContent = String(index + 1);
    button.dataset.answered = String(isAnswered(index));
    button.title = question;
    button.setAttribute("aria-label", "第 " + (index + 1) + " 题，" + (isAnswered(index) ? "已回答" : "未回答"));
    if (screen === "question" && state.index === index) button.setAttribute("aria-current", "step");
    button.addEventListener("click", () => {
      indexDialog.close();
      showQuestion(index);
    });
    return button;
  });
  el("index-grid").replaceChildren(...options);
  indexDialog.showModal();
});

el("finish").addEventListener("click", () => {
  state.complete = true;
  saveDraft();
  showDone();
});

el("copy").addEventListener("click", async () => {
  const text = responseText();
  try {
    await navigator.clipboard.writeText(text);
    exportStatus.textContent = "已复制答卷。";
    fallback.hidden = true;
  } catch {
    fallback.value = text;
    fallback.hidden = false;
    fallback.focus();
    fallback.select();
    exportStatus.textContent = "请手动复制下面的答卷，或点击下载。";
  }
});

el("download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob(["\ufeff", responseText()], { type: "text/plain;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "男朋友恋爱问卷答卷.txt";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  exportStatus.textContent = "已发起下载。";
});

progress.max = questions.length;
showQuestion(state.index, { focus: false });
if (state.complete) showDone(false);
  </script>
</body>
</html>
